name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: erasmatch
          POSTGRES_PASSWORD: erasmatch
          POSTGRES_DB: erasmatch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erasmatch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ERASMATCH_TEST_DATABASE_URL: postgresql+psycopg://erasmatch:erasmatch@localhost:5432/erasmatch_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests (unit + PostgreSQL integration)
        run: pytest --cov --cov-report=term-missing

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t erasmatch:ci .
