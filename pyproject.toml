[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "erasmatch"
version = "0.1.0"
description = "Find equivalent university courses for Erasmus Learning Agreements with multilingual embeddings and explainable scoring."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Gio" }]
keywords = ["erasmus", "learning-agreement", "embeddings", "pgvector", "fastapi", "llm"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Framework :: FastAPI",
  "License :: OSI Approved :: MIT License",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "pgvector>=0.3",
  "alembic>=1.13",
  "httpx>=0.27",
  "numpy>=1.26",
  "typer>=0.12",
  "pyyaml>=6.0",
  "pypdf>=4.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
erasmatch = "erasmatch.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/erasmatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["postgres: needs a PostgreSQL database with pgvector (set ERASMATCH_TEST_DATABASE_URL)"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = [
  "B008",   # FastAPI/Typer use function calls in defaults by design
  "SIM905", # str.split() word lists are easier to read than list literals
]

[tool.coverage.run]
source = ["erasmatch"]
omit = ["src/erasmatch/migrations/*"]
